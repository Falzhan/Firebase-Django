<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Poor Guy's Tech Blog{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Custom CSS -->
    {% load poorguy_extras %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'poorguy/css/theme.css' %}">
    
    <style>
        /* Light theme gradient background - majority white with green accents */
        .tech-bg {
            background: linear-gradient(135deg, #ffffff, #f0f7f0, #e8f5e8);
            min-height: 100vh;
        }
    </style>
</head>
<body class="tech-bg text-gray-800 antialiased">
    <!-- Header -->
    <header class="glass-card p-6 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-500 to-lime-500">
                Poor Guy's Tech Blog
            </h1>
            <nav class="space-x-4">
                <a href="{% url 'poorguy:tech_feed' %}" class="hover:text-emerald-300 transition-colors">Home</a>
                <a href="#reviewed-section" class="hover:text-emerald-300 transition-colors">The List</a>
                <a href="{% url 'poorguy:add_review' %}" class="bg-gradient-to-r from-emerald-500 to-lime-500 text-white px-4 py-2 rounded-lg hover:from-emerald-600 hover:to-lime-600 transition-all duration-300">Add Review</a>
                <a href="/admin/" class="hover:text-emerald-300 transition-colors">Admin</a>
            </nav>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        {% block content %}
        {% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="glass-card p-6 text-center text-sm opacity-80">
        <p>© 2025 Poor Guy's Tech Blog | Zhander Montefalcon </p>
    </footer>
</body>
</html>
